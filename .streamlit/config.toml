[theme]
base = "light"
primaryColor = "#1f3a5f"
backgroundColor = "#f6f5f1"
secondaryBackgroundColor = "#ffffff"
textColor = "#172131"
font = "sans-serif"

[server]
headless = true
# no file watcher: stops the noisy torchvision tracebacks from scanning transformers (restart after code edits)
fileWatcherType = "none"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
